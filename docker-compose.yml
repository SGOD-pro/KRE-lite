version: '3.9'

services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # mount source for live reload during development
      - ./backend:/backend
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=local
    # Phase 1 will add:
    #   depends_on: [chroma]  (if using ChromaDB server mode)
    # OR no external service at all (ChromaDB in embedded/local mode — preferred)

