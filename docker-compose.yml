version: '3.9'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cited_or_silent_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - QDRANT_ENDPOINT=${QDRANT_ENDPOINT}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-hackathon_db}
      - BEDROCK_TITAN_MODEL_ID=${BEDROCK_TITAN_MODEL_ID:-amazon.titan-embed-text-v2:0}
      - BEDROCK_NOVA_MODEL_ID=${BEDROCK_NOVA_MODEL_ID:-apac.amazon.nova-pro-v1:0}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cited_or_silent_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
