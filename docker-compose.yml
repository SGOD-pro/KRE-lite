version: '3.8'

services:
  api:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=local
      - RDS_HOST=postgres
      - REDIS_HOST=redis
      - FLOCI_ENDPOINT=http://host.docker.internal:4566
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=cited_or_silent
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
