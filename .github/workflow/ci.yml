name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend — pytest (unit, ingestion, retrieval, adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
          pip install pytest pytest-cov --break-system-packages || pip install pytest pytest-cov

      - name: Lint (ruff)
        run: |
          pip install ruff --break-system-packages || pip install ruff
          ruff check .

      - name: Run unit tests (citation verifier)
        run: pytest tests/unit/test_citation_verifier.py -v

      - name: Run ingestion tests
        run: pytest tests/unit/test_ingestion.py -v

      - name: Run retrieval sanity tests
        run: pytest tests/unit/test_retrieval.py -v

      - name: Run adversarial refusal test set
        # This is the test that matters most. It is intentionally its
        # own step, not folded into a generic `pytest tests/` run, so
        # that a failure here is unambiguous in the CI log rather than
        # buried among unrelated test failures. RULES.md target: 100%.
        run: pytest tests/unit/test_adversarial_refusal.py -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: htmlcov/
          retention-days: 7

  e2e-tests:
    name: End-to-End — Playwright
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python (for backend service used by e2e tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt

      - name: Start backend service
        run: |
          nohup python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --fail http://localhost:8000/health

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  boundaries-check:
    name: Sanity — no scope creep from BOUNDARIES.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if disallowed dependencies/services crept in
        # Cheap grep-based tripwire, not a substitute for the manual
        # PROMPT-VALIDATE pass in PROMPTS.md, but catches the obvious
        # cases automatically on every push.
        run: |
          set -e
          FORBIDDEN_PATTERNS="okf_builder|page_index_service|graph_retriever|boto3.client\\('sqs'\\)|elasticache"
          if grep -rEi "$FORBIDDEN_PATTERNS" --include="*.py" app/ 2>/dev/null; then
            echo "::error::Found code matching a BOUNDARIES.md excluded pattern. See BOUNDARIES.md."
            exit 1
          fi
          echo "No forbidden patterns found."
