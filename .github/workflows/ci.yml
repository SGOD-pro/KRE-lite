name: CI

on:
  push:
    branches: [ main, v1.1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─── Phase 0: must be green from commit one ────────────────────────────────
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify test collection (zero errors = green pipeline)
        run: pytest tests/unit/ --collect-only -q

      - name: Run unit tests
        run: pytest tests/unit/ -v

  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ─── Boundaries check: tripwire for BOUNDARIES.md violations ───────────────
  boundaries-check:
    name: Sanity — BOUNDARIES.md scope check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if disallowed patterns found in app/
        shell: bash
        run: |
          set -e
          FORBIDDEN="okf_builder|page_index_service|graph_retriever|boto3\.client\('sqs'\)|elasticache"
          if grep -rEi "$FORBIDDEN" --include="*.py" backend/app/ 2>/dev/null; then
            echo "::error::Found code matching a BOUNDARIES.md excluded pattern. See BOUNDARIES.md."
            exit 1
          fi
          echo "No forbidden patterns found — boundaries clean."
