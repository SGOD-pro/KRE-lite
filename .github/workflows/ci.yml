  #       with:
  #         node-version: "20"
  #         cache: "npm"
  #         cache-dependency-path: frontend/package-lock.json
  #     - name: Install frontend deps
  #       working-directory: frontend
  #       run: npm ci
  #     - name: Install Playwright browsers
  #       working-directory: frontend
  #       run: npx playwright install --with-deps chromium
  #     - name: Start backend
  #       working-directory: backend
  #       run: |
  #         nohup python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000 &
  #         sleep 5
  #         curl --fail http://localhost:8000/health
  #     - name: Run Playwright tests
  #       working-directory: frontend
  #       run: npx playwright test
  #       env:
  #         BASE_URL: http://localhost:3000
  #         API_URL: http://localhost:8000

  # ─── Boundaries check: tripwire for BOUNDARIES.md violations ───────────────
  boundaries-check:
    name: Sanity — BOUNDARIES.md scope check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if disallowed patterns found in app/
        # Cheap grep-based tripwire — catches the obvious cases.
        # Not a substitute for the manual PROMPT-VALIDATE pass in PROMPTS.md.
        shell: bash
        run: |
          set -e
          FORBIDDEN="okf_builder|page_index_service|graph_retriever|boto3\.client\('sqs'\)|elasticache|LocalStack"
          if grep -rEi "$FORBIDDEN" --include="*.py" backend/app/ 2>/dev/null; then
            echo "::error::Found code matching a BOUNDARIES.md excluded pattern. See BOUNDARIES.md."
            exit 1
          fi
          echo "No forbidden patterns found — boundaries clean."
