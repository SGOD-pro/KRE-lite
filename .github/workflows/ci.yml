name: CI

on:
  push:
  pull_request:

jobs:
  # ─── Phase 0: must be green from commit one ────────────────────────────────
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify test collection (zero errors = green pipeline)
        run: pytest tests/unit/ --collect-only -q

      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          CHROMA_PATH: /tmp/chroma_test

  # ─── Phase 3+: e2e tests (disabled until Phase 3 deliverables exist) ───────
