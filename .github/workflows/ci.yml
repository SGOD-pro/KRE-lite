name: CI

on:
  push:
    branches: [ main, v1.1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─── Phase 0: must be green from commit one ────────────────────────────────
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          QDRANT_ENDPOINT: ${{ secrets.QDRANT_ENDPOINT }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'cited_or_silent' }}

  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ─── Boundaries check: tripwire for BOUNDARIES.md violations ───────────────
  boundaries-check:
    name: Sanity — BOUNDARIES.md scope check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if disallowed patterns found in app/
        shell: bash
        run: |
          set -e
          FORBIDDEN="okf_builder|page_index_service|graph_retriever|boto3\.client\('sqs'\)|elasticache"
          if grep -rEi "$FORBIDDEN" --include="*.py" backend/app/ 2>/dev/null; then
            echo "::error::Found code matching a BOUNDARIES.md excluded pattern. See BOUNDARIES.md."
            exit 1
          fi
          echo "No forbidden patterns found — boundaries clean."

  # ─── Deployed backend health check — runs on every CI push ─────────────────
  #     Catches cases where the live backend drifts from what the codebase expects
  #     (e.g. a broken deploy from a previous run, infra rot, CORS regression).
  #     Skipped gracefully if DEPLOYED_BACKEND_URL secret is not configured.
  backend-health-ci:
    name: Live backend — health & CORS check
    runs-on: ubuntu-latest
    # Don't block merges if the secret isn't set — treat as advisory
    continue-on-error: true
    env:
      DEPLOYED_BACKEND_URL: ${{ secrets.DEPLOYED_BACKEND_URL }}
      DEPLOYED_FRONTEND_URL: ${{ secrets.DEPLOYED_FRONTEND_URL || 'https://kre-lite.vercel.app' }}

    steps:
      - name: Skip if no deployed URL configured
        if: env.DEPLOYED_BACKEND_URL == ''
        run: |
          echo "DEPLOYED_BACKEND_URL secret not set — skipping live health check."
          echo "Set the secret to enable this gate."
          exit 0

      - name: Health check — GET /health must return 200
        if: env.DEPLOYED_BACKEND_URL != ''
        run: |
          echo "Checking ${DEPLOYED_BACKEND_URL}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            "${DEPLOYED_BACKEND_URL}/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live backend health check FAILED — /health returned $STATUS"
            echo "::error::The deployed backend at $DEPLOYED_BACKEND_URL is unhealthy."
            exit 1
          fi
          echo "Health check PASSED (200 OK)"

      - name: CORS check — OPTIONS /ingest must allow frontend origin
        if: env.DEPLOYED_BACKEND_URL != ''
        run: |
          HEADERS=$(curl -s -I \
            --max-time 15 \
            -X OPTIONS \
            -H "Origin: ${DEPLOYED_FRONTEND_URL}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            "${DEPLOYED_BACKEND_URL}/ingest")
          echo "$HEADERS"
          if ! echo "$HEADERS" | grep -i "access-control-allow-origin"; then
            echo "::error::CORS check FAILED — access-control-allow-origin missing from /ingest preflight"
            exit 1
          fi
          echo "CORS check PASSED"

      - name: 10 MB size-limit check — POST /ingest with 11 MB returns 413
        if: env.DEPLOYED_BACKEND_URL != ''
        run: |
          dd if=/dev/zero bs=1M count=11 2>/dev/null > /tmp/oversized.pdf
          STATUS=$(curl -s -o /tmp/size_resp.json -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -F "files=@/tmp/oversized.pdf;type=application/pdf" \
            "${DEPLOYED_BACKEND_URL}/ingest")
          echo "HTTP status: $STATUS"
          cat /tmp/size_resp.json || true
          if [ "$STATUS" != "413" ]; then
            echo "::error::Size-limit check FAILED — expected 413, got $STATUS"
            echo "::error::The deployed backend may be running an old version without the 10 MB limit."
            exit 1
          fi
          echo "Size-limit check PASSED (413 returned as expected)"
