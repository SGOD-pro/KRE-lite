name: CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

            frontend:
              - 'frontend/**'

  deploy-backend:
    name: Deploy Backend (AWS Lambda)
    needs: changes

    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build SAM Application
        working-directory: backend
        run: sam build --use-container

      - name: Deploy SAM Application
        working-directory: backend
        run: |
          sam deploy \
            --stack-name kre-lite \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ap-south-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              TitanEmbedModelId="amazon.titan-embed-text-v2:0" \
              NovaLlmModelId="amazon.nova-pro-v1:0" \
              S3BucketName="cited-or-silent-docs" \
              QdrantEndpoint="${{ secrets.QDRANT_ENDPOINT }}" \
              QdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
              MongoDbUri="${{ secrets.MONGODB_URI }}" \
              MongoDbName="cited_or_silent"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: changes

    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}